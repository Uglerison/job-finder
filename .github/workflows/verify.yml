name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        run: python -m ruff check apps/api/src tests scripts

      - name: Check backend formatting
        run: python -m ruff format --check apps/api/src tests scripts

      - name: Check backend types
        run: python -m mypy apps/api/src

      - name: Test backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm --filter job-finder-web format:check

      - name: Lint frontend
        run: pnpm --filter job-finder-web lint

      - name: Test frontend
        run: pnpm --filter job-finder-web test

      - name: Build frontend
        run: pnpm --filter job-finder-web build
